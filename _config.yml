title: "ВЫБОРЫ - Технологии избирательных кампаний"
book_title: "ВЫБОРЫ - Технологии избирательных кампаний"
# Visible `<h1>` on language index pages (site.title stays canonical / SEO elsewhere).
localized_book_title:
  en: "Election campaign technologies"
  uk: "ВИБОРИ — технології виборчих кампаній"
  ru: "ВЫБОРЫ — технологии избирательных кампаний"
description: "Комплексное руководство по современным технологиям избирательных кампаний"
authors:
  - "Душин Игорь Леонидович"
  - "Сысун Александр Игоревич"
  - "Ложкин Борис Евгеньевич"
author: "Душин Игорь Леонидович, Сысун Александр Игоревич, Ложкин Борис Евгеньевич"
baseurl: "/Book-Elections"
url: "https://dushyn.com"
lang: uk
title_separator: " · "

# Feature flags
features:
  testimonials: false
  newsletter: false
  blog: false
  feedback: false

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Per-path defaults (SEO / language)
defaults:
  - scope:
      path: "about.md"
    values:
      lang: en
      description: "About the book on election campaign technologies — choose English, Ukrainian, or Russian."

# Collections
collections:
  uk_posts:
    output: true
    permalink: /uk/:title/
  ru_posts:
    output: true
    permalink: /ru/:title/
  en_posts:
    output: true
    permalink: /en/:title/

default_lang: uk

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md 
